# Cloudflare-like public proxy with a route + method ALLOWLIST. Default deny.
# Source of truth for what is allowed: data/proxy-allowlist.json (tests/security/methods.mjs checks this file against it).
#
# Path-normalisation bypass defence (the core design decision):
#   nginx `location` matches the DECODED, merged, dot-resolved $uri, but proxy_pass without a URI part forwards the RAW
#   $request_uri to GEV. A path that looks denied to one and allowed to the other is the classic bypass. So we never use
#   `location` for access control. We match the RAW $request_uri only, and refuse every raw path that contains anything a
#   normaliser would change: '%' (encoded dots/slashes/letters, %00), '//' (merged slashes), ';' (path params),
#   a backslash, a control or non-ASCII byte, and '.' or '..' segments. What survives is already in canonical form, so
#   raw == normalised, and a strict anchored regex allowlist decides. Matching is case-sensitive (Linux paths are),
#   so /API/WEATHER is denied. A trailing slash is denied unless the regex lists it. The query string is not inspected
#   (it cannot change which route GEV picks), but it is part of the raw URI, so '?x=/../' cannot smuggle a path.
#   '%' stays legal in the QUERY only.
# Methods: only GET and HEAD are ever allowed (no route needs POST). Everything else gets 403 from here, never from GEV.
# Every denial carries header X-Proxy-Deny: 1 and body PROXY_DENY so tests can tell the proxy from GEV.
events {}
http {
  access_log /dev/stdout;
  default_type text/plain;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Measured 2026-11-24 on `vite preview`: the 8.9 MB main JS bundle came back uncompressed with Cache-Control: no-cache.
  # Compress text here, and let Vite's hashed /assets/ files be cached for a year; every other route keeps the upstream header.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml application/wasm;
  map $uri $cache_ctl {
    default $upstream_http_cache_control;
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
  }

  # 1 = raw path is not in canonical form -> deny. First '?' ends the path part.
  map $request_uri $bad_uri {
    default 1;
    # must start with a single '/', then no bad pattern in the path part.
    "~^/" 0;
  }
  map $request_uri $bad_path {
    default 0;
    "~^[^?]*(%|//|;|[\x5c]|[^ -~]|/[.][.]?(/|[?]|$))" 1;
  }

  # 1 = restricted bundled asset that an allowlisted prefix (/src/) would otherwise serve. Checked BEFORE route_ok and
  # beats it (Session 4). Keep in sync with "deny" in data/proxy-allowlist.json.
  map $request_uri $deny_asset {
    default 0;
    "~^/src/data/local_data/telegeography_submarine_cables/" 1;
    "~^/src/data/local_data/ucs_satellites/" 1;
    "~^/src/data/local_data/imaging_sensors/" 1;
    "~^/src/data/local_data/cctv_ground_heights/" 1;
    "~^/events/bhote-koshi-2026(/|[?]|$)" 1;
  }

  # 1 = method + raw URI is allowlisted. Keep in sync with data/proxy-allowlist.json.
  # Segment charset P: letters digits _ @ . + ~ = , - and '/'. Query is optional: ([?].*)?
  map "$request_method $request_uri" $route_ok {
    default 0;
    # app shell, embed, share links
    "~^(GET|HEAD)[ ]/([?].*)?$" 1;
    "~^(GET|HEAD)[ ]/share/[A-Za-z0-9_-]+([?].*)?$" 1;
    # static assets in gev/public and root
    "~^(GET|HEAD)[ ](/style[.]css|/logo[.]svg|/location[.]svg|/mic[.]svg|/pin[.]svg|/visual-presets[.]svg|/manifest[.]webmanifest|/quebec-cameras[.]json|/favicon[.]ico)([?].*)?$" 1;
    "~^(GET|HEAD)[ ]/(icons|models)/[A-Za-z0-9_@.+~=,/-]+([?].*)?$" 1;
    # Vite module paths the browser needs to boot (dev server; accepted residual risk, see session3-findings #2)
    "~^(GET|HEAD)[ ]/(@vite|@id|src|node_modules|server|build)/[A-Za-z0-9_@.+~=,/-]+([?].*)?$" 1;
    # camera sources and health
    "~^(GET|HEAD)[ ]/api/cctv/(sources|health)([?].*)?$" 1;
    # weather and wind (permissive-licence sources; tile/image proxy params are checked by GEV)
    "~^(GET|HEAD)[ ]/api/(weather|weather/manifest|weather/tile|weather/image|weather-effects|wind/manifest|wind/grid)([?].*)?$" 1;
    # military aircraft (adsb.lol only, allowed_per_doc; exact path, so /api/military/track and /api/military-installations stay denied; plan item 19a)
    "~^GET[ ]/api/military([?].*)?$" 1;
    # wildfire perimeters (NIFC WFIGS + InciWeb, US public domain; exact paths; plan item 19b)
    "~^GET[ ]/api/fire-perimeters(/inciweb/(index|publication/[A-Za-z0-9_-]+))?([?].*)?$" 1;
    # wildlife sightings (Acartia CC BY 4.0), shipwrecks (Wikidata CC0 + EMODnet CC BY 4.0), terrain heights (Mapterhorn CC BY 4.0); exact paths; plan item 19c
    "~^GET[ ]/api/acartia/sightings([?].*)?$" 1;
    "~^GET[ ]/api/shipwrecks([?].*)?$" 1;
    "~^GET[ ]/api/terrain/heights([?].*)?$" 1;
    # tropical cyclone advisories (NOAA NHC/CPHC, public domain; exact path; plan item 19)
    "~^GET[ ]/api/cyclones([?].*)?$" 1;
    # radio station directory (Radio Browser, owner-approved; exact path, /click stays closed; plan item 22)
    "~^GET[ ]/api/radio/stations([?].*)?$" 1;
    # owner-approved space and lookup routes (plan item 22)
    "~^GET[ ]/api/celestrak(-satcat)?([?].*)?$" 1;
    "~^GET[ ]/api/adsbdb/(route|aircraft)/[A-Za-z0-9]{2,12}([?].*)?$" 1;
    "~^GET[ ]/api/launches([?].*)?$" 1;
    # static library layers: catalog + the 10 dataset ids whose permission is allowed_per_doc (session 4)
    "~^(GET|HEAD)[ ]/api/library(/data/(eia-power-plants|epa-superfund-sites|epa-toxic-release-facilities|epc-england-wales|fema-usa-structures|nasa-eonet-events|noaa-tide-stations|ntad-national-bridges|nws-active-alerts|wri-global-power-plants))?([?].*)?$" 1;
  }

  server {
    listen 8080;
    client_max_body_size 1k;
    # The marker header is added only on denials (never inherited by proxied GEV responses).
    if ($bad_uri)  { return 403 "PROXY_DENY bad-uri\n"; }
    if ($bad_path) { return 403 "PROXY_DENY non-canonical-path\n"; }
    if ($deny_asset) { return 403 "PROXY_DENY restricted-asset\n"; }
    if ($route_ok = 0) { return 403 "PROXY_DENY not-allowlisted\n"; }
    location / {
      # proxy_pass target with no URI part: raw $request_uri is forwarded unchanged (what we matched on).
      proxy_pass http://gev:4173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $cache_ctl always;
    }
  }
}
