name: staging
# Public NOINDEX staging site on GitHub Pages. Refreshes live feeds, builds, tests, gates, then deploys.
# Public repo: Actions minutes are free. Feeds refuse to overwrite good data with a failed run (importer guard).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      PUBLIC_SITE_URL: https://mwoovancity.github.io/live-camera-map
      PUBLIC_BASE_PATH: /live-camera-map
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test ops/staging/prepare.test.mjs
      - name: Refresh feeds and camera lists (ops/importers/run-all.json; each importer runs alone with its own time limit; a failed one keeps its last committed rows, shows as a red annotation here, and never stops the deploy)
        continue-on-error: true
        run: node ops/importers/run-all.mjs
      - name: Camera health check (previous result from the deployed site, 18 min time budget shared fairly by source)
        # Fair budget (rule health-fair-budget): each source gets a share of the 18 min and of the 10000-request cap by its own polite pace
        # (Finland images 1100 ms apart, Toronto 500 ms, DriveBC 300 ms, Caltrans 100 ms; Quebec links are never requested). Inside a source the
        # cameras checked longest ago go first (never checked first); the others keep their previous result from previous-health.json, and a camera whose
        # own last check is over 48 h old shows unknown. Each run prints per source "whole set every N runs = H h" (runs are 3 h apart). Today every
        # source fits one run. The step cannot pass 22 min: the checker stops itself at 18 min, this timeout is the backstop inside the 32 min job limit.
        timeout-minutes: 22
        run: |
          curl --fail --silent --show-error --location --max-time 30 -o previous-health.json "$PUBLIC_SITE_URL/health.json" || { echo "no previous health.json (first run or fetch failed): starting fresh"; rm -f previous-health.json; }
          if [ -s previous-health.json ]; then PREV="--previous previous-health.json"; else PREV=""; fi
          node ops/health/check.mjs $PREV --out data/health/health.json || echo "health checker crashed (exit $?): the deploy continues without a new health.json"
          mkdir -p site/public
          # a partial run wrote health.partial.json only: keep publishing the last good file (the pages hide it once it is over 24 h old)
          if [ ! -f data/health/health.json ] && [ -s previous-health.json ]; then mkdir -p data/health; cp previous-health.json data/health/health.json; echo "partial run: kept the previous good health.json"; fi
          if [ -f data/health/health.json ]; then cp data/health/health.json site/public/health.json; else echo "no health.json to publish"; fi
      - run: npm ci
        working-directory: site
      - name: Build with the staging URL
        run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site
      - run: node ops/harness/page-gate.mjs site/dist site/PAGES.md
      - name: Make it staging (base path, noindex, no sitemap)
        run: node ops/staging/prepare.mjs site/dist /live-camera-map
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
