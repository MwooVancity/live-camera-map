name: session3b-scan
# Recon spike: supply-chain and image scan of the pinned GEV. Never fails on vulnerability counts; fails only if a SECRET is found.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: git clone https://github.com/bilawalsidhu/gods-eye-view gev
      - run: git -C gev checkout "$(cut -d' ' -f1 ops/upstream-base.txt)"
      - run: node tests/immutability/check.mjs
      - run: node --check ops/audit/scan-summary.mjs
      - run: mkdir -p scan-out
      - name: Build pinned image (no edits to gev/)
        run: |
          docker build -t gev-pinned ./gev
          docker image inspect gev-pinned --format '{{.Id}}' | tee scan-out/image-id.txt
          docker image inspect gev-pinned --format '{{json .RepoDigests}} {{.Created}}' | tee -a scan-out/image-id.txt
      - name: npm audit (prod deps, from the lockfile, in a fresh clone; gev/ untouched)
        run: |
          git clone https://github.com/bilawalsidhu/gods-eye-view gev-audit
          git -C gev-audit checkout "$(cut -d' ' -f1 ops/upstream-base.txt)"
          cd gev-audit
          npm audit --omit=dev --package-lock-only --json > ../scan-out/npm-audit.json || true
          test -s ../scan-out/npm-audit.json
      - name: "Trivy via docker image (vulns, secrets, SBOM)"
        run: |
          T="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/w -w /w aquasec/trivy:0.58.1"
          $T image --scanners vuln --severity HIGH,CRITICAL --format json --output scan-out/trivy-image.json gev-pinned || true
          $T fs --scanners secret --format json --output scan-out/trivy-secrets.json gev || true
          $T image --format cyclonedx --output scan-out/sbom.cdx.json gev-pinned || true
          ls -la scan-out
      - run: node tests/immutability/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session3b-scan
          path: scan-out/
      - name: Summary (exits 1 only if a secret was found)
        run: node ops/audit/scan-summary.mjs scan-out
