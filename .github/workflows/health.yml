name: health
# Public health probe. Does nothing until the repo variable HEALTH_BASE_URL is set (Mike-only, after the host exists).
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: ${{ vars.HEALTH_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run healthcheck
        env:
          HEALTH_BASE_URL: ${{ vars.HEALTH_BASE_URL }}
        run: node ops/monitoring/healthcheck.mjs "$HEALTH_BASE_URL"
