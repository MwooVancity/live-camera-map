name: session6-preview
# Brings up the PREVIEW variant (build once, then vite preview) behind the allowlist proxy and measures it on Linux:
# route matrix, source exposure, gzip, cache headers, memory. Manual run only (it builds GEV: about 5-10 CI minutes).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f ops/deploy/docker-compose.yml -f ops/deploy/docker-compose.preview.yml
      HOSTNAME_UNDER_TEST: map.example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: git clone https://github.com/bilawalsidhu/gods-eye-view gev
      - run: git -C gev checkout "$(cut -d' ' -f1 ops/upstream-base.txt)"
      - run: node tests/immutability/check.mjs
      - run: cp ops/deploy/.env.example ops/deploy/.env
      - name: Compose up (build image, vite build, vite preview, wait for healthy), sampling container memory every 2 s
        run: |
          # Peak RAM of the gev container during `vite build` and after (ChatGPT's missing-fact list, 2026-11-24): decides 1 GB vs 2 GB.
          ( while true; do docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' >> mem-samples.txt 2>/dev/null; sleep 2; done ) &
          sampler=$!
          $COMPOSE up -d --build --wait --wait-timeout 600
          kill $sampler || true
          awk '/gev/ { v=$2; u=v; gsub(/[0-9.]/,"",u); n=v; gsub(/[A-Za-z]/,"",n); m=(u=="GiB")?n*1024:(u=="MiB")?n:(u=="kiB"||u=="KiB")?n/1024:0; if (m>mx) mx=m; c++ } END { printf "gev container peak memory seen: %.0f MiB over %d samples (build included)\n", mx, c }' mem-samples.txt
      - name: Memory (host and container) right after start
        run: |
          free -m
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
      - name: Allowlist and bypass matrix
        run: node tests/security/methods.mjs http://127.0.0.1:8080 "$HOSTNAME_UNDER_TEST"
      - name: Preview checks (source exposure, gzip, cache, api, embed)
        run: node tests/deploy/preview-checks.mjs http://127.0.0.1:8080 "$HOSTNAME_UNDER_TEST"
      - name: Restricted data built into /assets/ must be refused by the proxy (real file names from the build)
        run: |
          names=$($COMPOSE exec -T gev ls dist/assets | grep -E '^(cable-geo|landing-point-geo|ucs_satellites|imaging_sensors|cctv_ground_heights|ucsSatellites|imagingSensors)-' || true)
          echo "restricted files in the build:"; echo "$names"
          test -n "$names" || { echo "no restricted file names found: the carve-out list may be stale"; exit 1; }
          bad=0
          for n in $names; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $HOSTNAME_UNDER_TEST" "http://127.0.0.1:8080/assets/$n")
            echo "$code /assets/$n"; test "$code" = "403" || bad=1
          done
          test "$bad" = "0"
      - name: Critical probe and healthcheck
        run: |
          node tests/security/probe.mjs http://127.0.0.1:8080 "$HOSTNAME_UNDER_TEST" preview
          node ops/monitoring/healthcheck.mjs http://127.0.0.1:8080 "$HOSTNAME_UNDER_TEST"
      - name: Light load (200 requests, 20 at a time) then memory again
        run: |
          for i in $(seq 1 10); do
            for j in $(seq 1 20); do curl -s -o /dev/null -H "Host: $HOSTNAME_UNDER_TEST" http://127.0.0.1:8080/api/radio/stations & done; wait
          done
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
      - name: Logs and immutability
        if: always()
        run: |
          $COMPOSE logs --no-color > compose.log 2>&1 || true
          node tests/immutability/check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: session6-results
          path: compose.log
