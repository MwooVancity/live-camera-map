name: immutability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gev-immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # gev/ is a separate clone (not in this repo): re-create it at the pinned hash.
      - run: git clone https://github.com/bilawalsidhu/gods-eye-view gev
      - run: git -C gev checkout "$(cut -d' ' -f1 ops/upstream-base.txt)"
      - run: node tests/immutability/check.mjs
      - run: node --test tests/immutability/immutability.test.mjs
      - run: node --test tests/licensing/licensing.test.mjs
      - run: node ops/lint/preflight.mjs
      - run: node --test ops/lint/preflight.test.mjs
      - run: node --test tests/exclusion/exclusion.test.mjs tests/deploy/compose-lint.test.mjs tests/deploy/static-map.test.mjs
