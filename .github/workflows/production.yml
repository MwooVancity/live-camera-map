name: production
# Builds the real site (worldtrafficcameras.com) with fresh feeds and deploys it to Cloudflare Pages.
# Does NOTHING until the owner adds the two repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (plan.md owner to-do),
# so it adds no load before it can deploy. AFTER the secrets are set, staging.yml and this workflow BOTH run every importer and an 18-minute
# health probe every 3 hours (twice the source load): owner decision B13 (code review 2026-11-25), schedules unchanged until it is made.
# The site stays HIDDEN from search (noindex on every page, robots.txt Disallow, empty sitemap) until the owner sets the repository
# variable LAUNCH to the value live (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */3 * * *'
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: true
env:
  PUBLIC_SITE_URL: https://worldtrafficcameras.com
jobs:
  configured:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.cfg.outputs.ok }}
    steps:
      - id: cfg
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Cloudflare secrets not set: production deploy skipped (see plan.md owner to-do)."; fi
  deploy:
    needs: configured
    if: needs.configured.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch the pinned upstream folder (the licensing and immutability checks read it)
        run: |
          git clone https://github.com/bilawalsidhu/gods-eye-view gev
          git -C gev checkout "$(cut -d' ' -f1 ops/upstream-base.txt)"
      - name: Gates that must pass before anything deploys (B3, the same checks immutability.yml runs)
        run: |
          node tests/immutability/check.mjs
          node --test tests/licensing/licensing.test.mjs
          node ops/lint/preflight.mjs
      - name: Refresh feeds and camera lists (ops/importers/run-all.json; each importer runs alone with its own time limit; a failed one keeps its last committed rows and never stops the deploy; `required` in run-all.json only picks an error or a warning annotation, because this step has continue-on-error)
        continue-on-error: true
        run: node ops/importers/run-all.mjs
      - name: Camera health check (fair budget by source, previous result from the live site or, on the first run, from staging)
        timeout-minutes: 22
        run: |
          curl --fail --silent --location --max-time 30 -o previous-health.json "$PUBLIC_SITE_URL/health.json" || curl --fail --silent --location --max-time 30 -o previous-health.json "https://worldtrafficcameras.pages.dev/health.json" || curl --fail --silent --location --max-time 30 -o previous-health.json "https://mwoovancity.github.io/live-camera-map/health.json" || { echo "no previous health.json: starting fresh"; rm -f previous-health.json; }
          if [ -s previous-health.json ]; then PREV="--previous previous-health.json"; else PREV=""; fi
          node ops/health/check.mjs $PREV --out data/health/health.json || echo "health checker crashed (exit $?): the deploy continues without a new health.json"
          mkdir -p site/public
          if [ ! -f data/health/health.json ] && [ -s previous-health.json ]; then mkdir -p data/health; cp previous-health.json data/health/health.json; fi
          if [ -f data/health/health.json ]; then cp data/health/health.json site/public/health.json; else echo "no health.json to publish"; fi
      # The map (God's Eye View as static files, no server) is its own Pages project. Every map step may fail without stopping the directory
      # deploy; the LAST step of the job turns the run red. Keyless: the build step gets no secrets and the fresh clone has no .env.
      - name: Map - keyless engine build in the CI clone, then the static folder (restricted data removed and checked)
        id: mapbuild
        continue-on-error: true
        timeout-minutes: 10
        env:
          LAUNCH: ${{ vars.LAUNCH }}
          PUPPETEER_SKIP_DOWNLOAD: '1'
          # The one key here: Mapillary's client token is public by design (gev/SECURITY.md:37) and ends up in the browser anyway.
          MAPILLARY_CLIENT_TOKEN: ${{ secrets.MAPILLARY_CLIENT_TOKEN }}
          # Used only at build time by the fire snapshot; it never reaches the browser.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          (cd gev && npm ci --no-audit --no-fund && GEV_DIR="$PWD" npx vite build --config ../ops/deploy/gev-static.vite.config.mjs)
          node tests/immutability/check.mjs
          node ops/deploy/build-static-map.mjs gev "$RUNNER_TEMP/map-dist"
          echo "dir=$RUNNER_TEMP/map-dist" >> "$GITHUB_OUTPUT"
      - name: Map - create the Cloudflare Pages project if it does not exist yet (harmless when it does)
        if: steps.mapbuild.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create worldtrafficcameras-map --production-branch=main
      - name: Map - deploy to Cloudflare Pages
        id: mapdeploy
        if: steps.mapbuild.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.mapbuild.outputs.dir }} --project-name=worldtrafficcameras-map --branch=main
      - run: npm ci
        working-directory: site
      - name: Build and test the normal site (the tests expect the indexable build)
        run: |
          npm run build
          npm test
        working-directory: site
      - run: node ops/harness/page-gate.mjs site/dist site/PAGES.md
      - run: node --test tests/parity/parity.test.mjs tests/parity/argos-maps.test.mjs tests/parity/no-argos-in-site.test.mjs
      - name: Build the site to deploy (hidden from search unless the repository variable LAUNCH is exactly live; GitHub's == ignores case, so the shell compares it)
        env:
          LAUNCH: ${{ vars.LAUNCH }}
          MAP_URL: https://worldtrafficcameras-map.pages.dev/
          MAP_DEPLOY: ${{ steps.mapdeploy.outcome }}
        run: |
          if [ "$LAUNCH" = "live" ]; then export PUBLIC_NOINDEX=0; else export PUBLIC_NOINDEX=1; fi
          echo "LAUNCH=$LAUNCH -> PUBLIC_NOINDEX=$PUBLIC_NOINDEX"
          # Frame the map when this run deployed it or an earlier deploy still answers; otherwise /map/ keeps its "not deployed" text.
          if [ "$MAP_DEPLOY" = "success" ] || curl -sf --max-time 20 -o /dev/null "$MAP_URL"; then export PUBLIC_GEV_EMBED_URL="$MAP_URL"; fi
          echo "PUBLIC_GEV_EMBED_URL=$PUBLIC_GEV_EMBED_URL"
          npm run build -- --outDir dist-deploy
        working-directory: site
      - name: Check the build that is uploaded (B10; the tests above ran on the indexable build)
        env:
          LAUNCH: ${{ vars.LAUNCH }}
        run: node ops/harness/deploy-noindex.mjs site/dist-deploy "$LAUNCH"
      - name: Create the Cloudflare Pages project if it does not exist yet (harmless when it does)
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create worldtrafficcameras --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist-deploy --project-name=worldtrafficcameras --branch=main
      - name: Attach the custom domain (idempotent; this does NOT create DNS records, they were added by hand 2026-11-26, the last step checks them)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for D in worldtrafficcameras.com www.worldtrafficcameras.com; do
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/worldtrafficcameras/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"name\":\"$D\"}" | head -c 300; echo
          done
      - name: The live domain must load (runs after the deploy, so it blocks nothing; a red run means visitors cannot reach the site)
        run: |
          for U in https://worldtrafficcameras.com/ https://www.worldtrafficcameras.com/; do
            curl -sSf --retry 5 --retry-delay 20 --retry-all-errors --max-time 30 -o /dev/null "$U"
            echo "OK $U"
          done
      - name: Map result (a failed map never blocks the directory, but the run must be red)
        if: ${{ !cancelled() && (steps.mapbuild.outcome == 'failure' || steps.mapdeploy.outcome == 'failure') }}
        run: |
          echo "::error::The map was not deployed: build=${{ steps.mapbuild.outcome }} deploy=${{ steps.mapdeploy.outcome }}. See the Map steps."
          exit 1
