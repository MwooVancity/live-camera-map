name: site
# Builds the Astro site from the camera registry and runs the tests over the built pages.
on:
  push:
    paths:
      - 'site/**'
      - 'data/camera-registry/**'
      - 'ops/importers/lib/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site
      - run: node ops/harness/page-gate.mjs site/dist site/PAGES.md
      - run: node ops/lint/preflight.mjs
